name: Build and Push Docker Images

on:
  push:
    branches: [main]
    # A version tag publishes the images for that release beside :latest, so
    # docker-compose.prod.yml can be pinned to a version. See docs/RELEASING.md.
    tags: ['v*']
  workflow_dispatch:

# One image build at a time per ref: a superseded build would otherwise keep
# running and publish tags nobody asked for. Two refs (main and a release tag)
# still build in parallel.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A stuck buildx step otherwise sits until GitHub's 6-hour job limit and is
    # then reported as "cancelled" (run #68, 2026-11-20). Fail fast instead.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tag scheme, identical for both images:
      #   push to main -> :latest and :sha-<short>
      #   v0.2.0 tag   -> :0.2.0, :0.2, :sha-<short>, and :latest (metadata-action
      #                   treats a semver tag as the new stable image, which is
      #                   what a release wants; tag the release commit on main)
      - name: Metadata for gateway
        id: meta-gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rclient-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Metadata for web
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rclient-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./gateway
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
