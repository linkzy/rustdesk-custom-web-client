# Cloudflare Tunnel config for a demo instance — TEMPLATE.
#
# Replace the placeholders, then save it outside the repository, e.g. as
# /etc/cloudflared/rclient-demo.yml. Never commit the filled-in file: it names
# your tunnel's credentials path, and the credentials themselves are a secret.
#
# This is a single-ingress config on purpose: a demo should never share a tunnel
# with anything else you run.

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: /etc/cloudflared/<YOUR-TUNNEL-UUID>.json

ingress:
  - hostname: demo.example.com
    service: http://127.0.0.1:8090
    originRequest:
      httpHostHeader: demo.example.com
  # Anything unmatched must 404 rather than fall through to the demo.
  - service: http_status:404
