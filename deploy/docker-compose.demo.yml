# A demo instance of rclient — TEMPLATE.
#
# Copy this to the demo host as docker-compose.yml, with a .env beside it made
# from deploy/demo.env.example, and replace the placeholders below.
#
# It is deliberately self-contained: its own compose project, its own network,
# its own relay pair and its own key, so a demo cannot touch anything else you
# run on the machine. See deploy/DEMO.md for the reasoning.
#
# Redeploy:
#   cd <stack-dir> && DOCKER_CONFIG=./.docker docker compose pull && \
#     DOCKER_CONFIG=./.docker docker compose up -d
#
# Ports: the web UI listens on 127.0.0.1 only; the gateway publishes nothing, so
# your proxy or tunnel is the single public entry point.

name: rclient-demo

services:
  # --- The demo's own RustDesk relay -------------------------------------
  # Host networking, because RustDesk must see real peer IPs. Reachable directly
  # on a DNS-only hostname (NOT through a proxy):
  #   21115/tcp, 21116/tcp+udp, 21117/tcp, 21118/tcp, 21119/tcp
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rclient-demo-hbbs
    # -r tells peers which relay to use; keep it in sync with HBBR_HOST in .env.
    command: hbbs -r relay-demo.example.com:21117
    network_mode: host
    volumes:
      - ./relay-data:/root
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Stop a host-wide auto-updater from restarting a live session.
      - "com.centurylinklabs.watchtower.enable=false"

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rclient-demo-hbbr
    command: hbbr
    network_mode: host
    volumes:
      - ./relay-data:/root
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # --- The application ---------------------------------------------------
  gateway:
    image: ghcr.io/YOUR_USER/rclient-gateway:latest
    container_name: rclient-demo-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # HBBS_HOST / HBBS_WS_PORT / HBBR_HOST / HBBR_WS_PORT / SERVER_KEY /
      # CAPTCHA_ENABLED come from .env (never committed).
      - GATEWAY_PORT=4000
    expose:
      - "4000"
    networks:
      - demo
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    mem_limit: 192m
    memswap_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/YOUR_USER/rclient-web:latest
    container_name: rclient-demo-web
    restart: unless-stopped
    ports:
      # Localhost only: the proxy or tunnel is the public door.
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      - gateway
    networks:
      - demo
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    mem_limit: 96m
    memswap_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  demo:
    driver: bridge
